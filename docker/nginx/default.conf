limit_req_zone $binary_remote_addr zone=botanical_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=botanical_connections:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api {
        limit_req zone=botanical_api burst=60 nodelay;
        limit_conn botanical_connections 20;
        proxy_pass http://backend:80/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Stripe event payloads are larger than normal API JSON bodies. Keep the
    # larger allowance scoped to this exact endpoint only.
    location = /api/payments/webhook {
        client_max_body_size 1m;
        limit_req zone=botanical_api burst=60 nodelay;
        limit_conn botanical_connections 20;
        proxy_pass http://backend:80/api/payments/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=botanical_api burst=60 nodelay;
        limit_conn botanical_connections 20;
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* "-[A-Z0-9]{8}\.(?:css|js)$" {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|svg|webp|avif)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
